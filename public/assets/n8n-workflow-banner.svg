<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Card & Glow Filters -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowOrange" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff6d5a" flood-opacity="0.6"/>
    </filter>
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
    <filter id="glowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#c084fc" flood-opacity="0.5"/>
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#34d399" flood-opacity="0.6"/>
    </filter>

    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="50%" stop-color="#182338"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Node Gradient Headers -->
    <linearGradient id="orangeHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6d5a"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="blueHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="purpleHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="greenHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="pinkHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- Rich Canvas Background -->
  <rect width="1200" height="680" fill="url(#bgCanvas)"/>

  <!-- Blueprint Coordinate Grid (Crisp and visible) -->
  <g opacity="0.16" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>

    <line x1="120" y1="0" x2="120" y2="680"/>
    <line x1="240" y1="0" x2="240" y2="680"/>
    <line x1="360" y1="0" x2="360" y2="680"/>
    <line x1="480" y1="0" x2="480" y2="680"/>
    <line x1="600" y1="0" x2="600" y2="680"/>
    <line x1="720" y1="0" x2="720" y2="680"/>
    <line x1="840" y1="0" x2="840" y2="680"/>
    <line x1="960" y1="0" x2="960" y2="680"/>
    <line x1="1080" y1="0" x2="1080" y2="680"/>
  </g>

  <!-- Top Canvas Header Bar -->
  <g transform="translate(40, 28)">
    <rect width="1120" height="56" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <!-- n8n Logo Mark -->
    <rect x="18" y="14" width="28" height="28" rx="7" fill="#ff6d5a"/>
    <text x="24" y="33" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="14" font-weight="900">n8n</text>
    <!-- Workflow Title -->
    <text x="56" y="34" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="15" font-weight="800">🤖 AI Instagram Meme Generator</text>
    <text x="335" y="34" fill="#94a3b8" font-family="Manrope, system-ui, sans-serif" font-size="12" font-weight="600">/ Production Pipeline</text>

    <!-- Execution Pill -->
    <rect x="915" y="14" width="185" height="28" rx="14" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1"/>
    <circle cx="930" cy="28" r="4" fill="#10b981" filter="url(#glowGreen)"/>
    <text x="942" y="32" fill="#34d399" font-family="Manrope, system-ui, sans-serif" font-size="11" font-weight="800">AUTONOMOUS · EVERY 12H</text>
  </g>

  <!-- Glowing Connecting Cables -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Schedule -> Generate Meme -->
    <path d="M 220 220 L 310 220" stroke="#ff6d5a" stroke-width="3.5" filter="url(#glowOrange)"/>
    <!-- Generate Meme -> Wait -->
    <path d="M 480 220 L 560 220" stroke="#ff6d5a" stroke-width="3.5" filter="url(#glowOrange)"/>
    <!-- Wait -> Get Image -->
    <path d="M 680 220 L 760 220" stroke="#38bdf8" stroke-width="3.5" filter="url(#glowBlue)"/>
    <!-- Get Image -> Check Ready -->
    <path d="M 930 220 C 990 220, 990 380, 840 440" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" filter="url(#glowBlue)"/>
    <!-- Check Ready -> GPT-4o Caption -->
    <path d="M 670 440 L 580 440" stroke="#10b981" stroke-width="3.5" filter="url(#glowGreen)"/>
    <!-- GPT-4o Caption -> Post Instagram -->
    <path d="M 400 440 C 330 440, 330 550, 420 570 L 500 570" stroke="#ec4899" stroke-width="3.5"/>
    <!-- Post Instagram -> Success Webhook -->
    <path d="M 670 570 L 750 570" stroke="#a855f7" stroke-width="3.5" filter="url(#glowPurple)"/>
  </g>

  <!-- ==================== ROW 1 NODES ==================== -->

  <!-- Node 1: Schedule Trigger -->
  <g transform="translate(50, 165)" filter="url(#cardShadow)">
    <rect width="170" height="110" rx="14" fill="#1e293b" stroke="#ff6d5a" stroke-width="2"/>
    <path d="M 0 14 Q 0 0 14 0 L 156 0 Q 170 0 170 14 L 170 32 L 0 32 Z" fill="url(#orangeHeader)"/>
    <text x="14" y="21" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="11" font-weight="800">📅 SCHEDULE TRIGGER</text>
    <text x="14" y="60" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="15" font-weight="750">Cron Schedule</text>
    <text x="14" y="82" fill="#cbd5e1" font-family="Manrope, system-ui, sans-serif" font-size="12">Every 12 Hours</text>
    <rect x="14" y="90" width="70" height="14" rx="4" fill="#334155"/>
    <text x="19" y="100" fill="#f8fafc" font-family="monospace" font-size="9">interval: 12h</text>
    <circle cx="170" cy="55" r="6" fill="#ff6d5a" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Node 2: MagicHour Generate Meme -->
  <g transform="translate(310, 165)" filter="url(#cardShadow)">
    <rect width="170" height="110" rx="14" fill="#1e293b" stroke="#ff6d5a" stroke-width="2"/>
    <path d="M 0 14 Q 0 0 14 0 L 156 0 Q 170 0 170 14 L 170 32 L 0 32 Z" fill="url(#orangeHeader)"/>
    <text x="14" y="21" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="11" font-weight="800">🎨 HTTP REQUEST</text>
    <text x="14" y="60" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="15" font-weight="750">Generate Meme</text>
    <text x="14" y="82" fill="#cbd5e1" font-family="Manrope, system-ui, sans-serif" font-size="12">MagicHour AI API</text>
    <rect x="14" y="90" width="95" height="14" rx="4" fill="#334155"/>
    <text x="19" y="100" fill="#38bdf8" font-family="monospace" font-size="9">POST /ai-meme-gen</text>
    <circle cx="0" cy="55" r="6" fill="#ff6d5a" stroke="#ffffff" stroke-width="2"/>
    <circle cx="170" cy="55" r="6" fill="#ff6d5a" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Node 3: Wait Buffer -->
  <g transform="translate(560, 175)" filter="url(#cardShadow)">
    <rect width="120" height="90" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="16" y="34" fill="#f8fafc" font-family="Manrope, system-ui, sans-serif" font-size="14" font-weight="750">⏳ Wait</text>
    <text x="16" y="58" fill="#94a3b8" font-family="Manrope, system-ui, sans-serif" font-size="11">20s Buffer for</text>
    <text x="16" y="74" fill="#cbd5e1" font-family="Manrope, system-ui, sans-serif" font-size="11" font-weight="600">AI Rendering</text>
    <circle cx="0" cy="45" r="5" fill="#64748b" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="120" cy="45" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Node 4: Get Generated Image -->
  <g transform="translate(760, 165)" filter="url(#cardShadow)">
    <rect width="170" height="110" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 0 14 Q 0 0 14 0 L 156 0 Q 170 0 170 14 L 170 32 L 0 32 Z" fill="url(#blueHeader)"/>
    <text x="14" y="21" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="11" font-weight="800">🖼️ HTTP GET</text>
    <text x="14" y="60" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="14" font-weight="750">Fetch Image</text>
    <text x="14" y="82" fill="#cbd5e1" font-family="Manrope, system-ui, sans-serif" font-size="12">Retrieves Meme URL</text>
    <rect x="14" y="90" width="85" height="14" rx="4" fill="#334155"/>
    <text x="19" y="100" fill="#38bdf8" font-family="monospace" font-size="9">GET /v1/projects</text>
    <circle cx="0" cy="55" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <circle cx="170" cy="55" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- ==================== ROW 2 NODES ==================== -->

  <!-- Node 5: Check Image Ready (If) -->
  <g transform="translate(670, 385)" filter="url(#cardShadow)">
    <rect width="170" height="110" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <path d="M 0 14 Q 0 0 14 0 L 156 0 Q 170 0 170 14 L 170 32 L 0 32 Z" fill="url(#greenHeader)"/>
    <text x="14" y="21" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="11" font-weight="800">✅ IF CONDITION</text>
    <text x="14" y="60" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="14" font-weight="750">Validate Image</text>
    <text x="14" y="82" fill="#cbd5e1" font-family="Manrope, system-ui, sans-serif" font-size="12">URL &amp; Render Gate</text>
    <rect x="14" y="90" width="105" height="14" rx="4" fill="#334155"/>
    <text x="19" y="100" fill="#34d399" font-family="monospace" font-size="9">downloads[0].url</text>
    <circle cx="170" cy="55" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="55" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Node 6: GPT-4o Vision Caption Generator -->
  <g transform="translate(400, 385)" filter="url(#cardShadow)">
    <rect width="180" height="110" rx="14" fill="#1e293b" stroke="#7c3aed" stroke-width="2"/>
    <path d="M 0 14 Q 0 0 14 0 L 166 0 Q 180 0 180 14 L 180 32 L 0 32 Z" fill="url(#purpleHeader)"/>
    <text x="14" y="21" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="11" font-weight="800">🧠 OPENAI LANGCHAIN</text>
    <text x="14" y="60" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="14" font-weight="750">GPT-4o Vision</text>
    <text x="14" y="82" fill="#cbd5e1" font-family="Manrope, system-ui, sans-serif" font-size="12">Multimodal Caption &amp; Tags</text>
    <rect x="14" y="90" width="85" height="14" rx="4" fill="#334155"/>
    <text x="19" y="100" fill="#c084fc" font-family="monospace" font-size="9">gpt-4o-mini</text>
    <circle cx="180" cy="55" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="55" r="6" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- ==================== ROW 3 NODES ==================== -->

  <!-- Node 7: Post to Instagram (Late API) -->
  <g transform="translate(500, 515)" filter="url(#cardShadow)">
    <rect width="170" height="110" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <path d="M 0 14 Q 0 0 14 0 L 156 0 Q 170 0 170 14 L 170 32 L 0 32 Z" fill="url(#pinkHeader)"/>
    <text x="14" y="21" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="11" font-weight="800">📱 INSTAGRAM API</text>
    <text x="14" y="60" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="14" font-weight="750">Post to Instagram</text>
    <text x="14" y="82" fill="#cbd5e1" font-family="Manrope, system-ui, sans-serif" font-size="12">Scheduled Social Feed</text>
    <rect x="14" y="90" width="75" height="14" rx="4" fill="#334155"/>
    <text x="19" y="100" fill="#f43f5e" font-family="monospace" font-size="9">Late API v1</text>
    <circle cx="0" cy="55" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="2"/>
    <circle cx="170" cy="55" r="6" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Node 8: Log Success -->
  <g transform="translate(750, 515)" filter="url(#cardShadow)">
    <rect width="160" height="110" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <path d="M 0 14 Q 0 0 14 0 L 146 0 Q 160 0 160 14 L 160 32 L 0 32 Z" fill="url(#greenHeader)"/>
    <text x="14" y="21" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="11" font-weight="800">📊 OBSERVABILITY</text>
    <text x="14" y="60" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="14" font-weight="750">Log Success</text>
    <text x="14" y="82" fill="#cbd5e1" font-family="Manrope, system-ui, sans-serif" font-size="12">Audit &amp; Webhook</text>
    <rect x="14" y="90" width="75" height="14" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="19" y="100" fill="#34d399" font-family="monospace" font-size="9">200 OK ✓</text>
    <circle cx="0" cy="55" r="6" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Bottom-Left Architecture Spec Card -->
  <g transform="translate(50, 385)">
    <rect width="280" height="240" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="20" y="32" fill="#ffffff" font-family="Manrope, system-ui, sans-serif" font-size="14" font-weight="800">Pipeline Specifications</text>
    
    <g transform="translate(20, 52)">
      <circle cx="5" cy="5" r="3.5" fill="#ff6d5a"/>
      <text x="16" y="9" fill="#94a3b8" font-family="Manrope, system-ui, sans-serif" font-size="11">Trigger: <tspan fill="#f8fafc" font-weight="600">Every 12h Cron</tspan></text>
    </g>
    <g transform="translate(20, 80)">
      <circle cx="5" cy="5" r="3.5" fill="#38bdf8"/>
      <text x="16" y="9" fill="#94a3b8" font-family="Manrope, system-ui, sans-serif" font-size="11">AI Model: <tspan fill="#f8fafc" font-weight="600">MagicHour + GPT-4o</tspan></text>
    </g>
    <g transform="translate(20, 108)">
      <circle cx="5" cy="5" r="3.5" fill="#c084fc"/>
      <text x="16" y="9" fill="#94a3b8" font-family="Manrope, system-ui, sans-serif" font-size="11">Vision Engine: <tspan fill="#f8fafc" font-weight="600">GPT-4o Multimodal</tspan></text>
    </g>
    <g transform="translate(20, 136)">
      <circle cx="5" cy="5" r="3.5" fill="#ec4899"/>
      <text x="16" y="9" fill="#94a3b8" font-family="Manrope, system-ui, sans-serif" font-size="11">Target Platform: <tspan fill="#f8fafc" font-weight="600">Instagram Feed</tspan></text>
    </g>
    <g transform="translate(20, 164)">
      <circle cx="5" cy="5" r="3.5" fill="#10b981"/>
      <text x="16" y="9" fill="#94a3b8" font-family="Manrope, system-ui, sans-serif" font-size="11">Fault Tolerance: <tspan fill="#f8fafc" font-weight="600">Auto Retry &amp; Error Gate</tspan></text>
    </g>
    <g transform="translate(20, 192)">
      <rect width="240" height="32" rx="8" fill="#334155" fill-opacity="0.6"/>
      <text x="12" y="20" fill="#38bdf8" font-family="monospace" font-size="11">100% Zero-Touch Autonomous</text>
    </g>
  </g>
</svg>
